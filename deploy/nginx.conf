# Install as an Nginx site on the host. Adjust the domain, certificate paths and
# upstream port to match SERVER_URL / APP_PORT. This is a production HTTPS example;
# obtain the certificate before enabling this file (see docs/deployment.md).
server {
    listen 80;
    listen [::]:80;
    server_name traceonsnow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://traceonsnow.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name traceonsnow.com;

    ssl_certificate /etc/letsencrypt/live/traceonsnow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traceonsnow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Payload accepts a 10 MB file; allow room for multipart form overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Next.js streams responses; do not buffer or cache Admin/API responses.
        proxy_buffering off;
    }
}
