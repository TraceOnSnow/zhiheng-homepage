# HTTP-only certificate bootstrap. Restrict port 80 to your own IP until the
# administrator is created. The application is deliberately not exposed here.
server {
    listen 80;
    listen [::]:80;
    server_name traceonsnow.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
